name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip3 install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Build APK
        run: |
          export PATH=$PATH:~/.local/bin
          # รัน buildozer 1 ครั้งเพื่อสร้างโฟลเดอร์ SDK
          buildozer android debug || true
          
          # วิธีแก้ Broken pipe: ใช้ printf พ่น y จำนวนมากแทนคำสั่ง yes
          if [ -d ~/.buildozer/android/platform/android-sdk/cmdline-tools ]; then
            SDKMANAGER=$(find ~/.buildozer/android/platform/android-sdk -name sdkmanager | head -n 1)
            if [ -n "$SDKMANAGER" ]; then
              printf 'y\n%.0s' {1..50} | $SDKMANAGER --licenses || true
            fi
          fi

          # รัน Build รอบจริง
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thailang-apk
          path: bin/*.apk
