name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # ปิดการมองหา requirements.txt เพื่อไม่ให้ Error
          # cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --user --upgrade buildozer cython virtualenv

      - name: Cache Buildozer Artifacts & SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: buildozer-${{ github.run_id }}
          restore-keys: |
            buildozer-

      - name: Build APK with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: bin/*.apk
