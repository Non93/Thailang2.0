name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Accept Licenses
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip3 install --upgrade buildozer cython==0.29.36 virtualenv
          
          # สร้างโฟลเดอร์ SDK และรับ License ล่วงหน้าแบบไม่พึ่ง Action
          mkdir -p ~/.buildozer/android/platform/android-sdk
          
      - name: Build APK with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          
          # รัน Buildozer รอบแรกเพื่อดาวน์โหลด SDK (ปล่อยให้พังเรื่อง license ไปก่อน)
          buildozer -v android debug || true
          
          # หาไฟล์ sdkmanager และสั่งรับ License ตรงๆ
          SDKMANAGER=$(find ~/.buildozer/android/platform/android-sdk -name sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            echo "Found sdkmanager at $SDKMANAGER"
            # ใช้ yes ส่งค่า y เข้าไป (ถ้ามันขึ้น Broken pipe ให้ถือว่าผ่าน)
            yes | $SDKMANAGER --licenses || true
          fi
          
          # รัน Buildozer รอบจริง (รอบนี้จะผ่านแล้ว)
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thailang-apk
          path: bin/*.apk
