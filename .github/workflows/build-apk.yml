name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip3 install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Build APK
        run: |
          export PATH=$PATH:~/.local/bin
          # รัน buildozer 1 ครั้งเพื่อให้มันดาวน์โหลด SDK มาก่อน (ถ้ายังไม่มี)
          buildozer android debug || true
          
          # ยอมรับ License ทั้งหมดแบบอัตโนมัติ
          if [ -f ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ]; then
            yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          elif [ -f ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager ]; then
            yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses
          fi

          # รัน Build จริงอีกรอบ (รอบนี้จะผ่านแล้ว)
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thailang-apk
          path: bin/*.apk
