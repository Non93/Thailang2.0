name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest  # ใช้ Image ทางการของ Kivy ที่พร้อม Build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          # สั่ง build โดยใช้ค่าจาก buildozer.spec
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thailang-apk
          path: bin/*.apk
