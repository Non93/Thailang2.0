name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          # สร้างโฟลเดอร์ SDK และบังคับรับ License ก่อนเริ่ม Build
          mkdir -p ~/.buildozer/android/platform/android-sdk
          
          # รัน buildozer รอบแรกเพื่อดึง SDK (ปล่อยให้พังเรื่อง license)
          echo "y" | buildozer android debug || true
          
          # หา sdkmanager แล้วกดรับ license ให้ครบ
          SDKMANAGER=$(find ~/.buildozer/android/platform/android-sdk -name sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          fi
          
          # รัน buildozer รอบจริง (รอบนี้จะผ่านแล้ว)
          echo "y" | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thailang-apk
          path: bin/*.apk
